<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
			<title>BPA Navigator Launch</title>
		</head>
	<body>
		<p id="status">Preparing BPA Assembly Navigator...</p>

		<script>
			(() => {
			"use strict";

			const ALPHABET =
			"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
			"abcdefghijklmnopqrstuvwxyz_$";

			const PROJECT_URL =
			"https://web.connect.trimble.com/projects/" +
			"l7enVCZktZA/viewer/3d/?modelId=LPDL2Rmxp1E";

			const PROJECT_KEY = "test-project";

			const ifcGuid =
			new URLSearchParams(location.search).get("g") || "";

			const status = document.getElementById("status");

			function decodeIfcGuid(value) {
			if (!/^[A-Za-z0-9_$]{22}$/.test(value) ||
			ALPHABET.indexOf(value[0]) > 3) {
			throw new Error("Invalid IFC GUID.");
			}

			let hex = "";
			let offset = 0;

			for (const size of [2, 4, 4, 4, 4, 4]) {
			let number = 0;

			for (let i = 0; i < size; i++) {
                    const digit = ALPHABET.indexOf(
                        value[offset++]
                    );

                    if (digit < 0) {
                        throw new Error("Invalid IFC GUID.");
                    }

                    number = number * 64 + digit;
                }

                const width = size === 2 ? 2 : 6;
                const maximum = size === 2
                    ? 0xff
                    : 0xffffff;

                if (number > maximum) {
                    throw new Error("Invalid IFC GUID group.");
                }

                hex += number.toString(16)
                    .padStart(width, "0");
            }

            return [
                hex.slice(0, 8),
                hex.slice(8, 12),
                hex.slice(12, 16),
                hex.slice(16, 20),
                hex.slice(20)
            ].join("-");
        }

        try {
            const teklaGuid = decodeIfcGuid(ifcGuid);

            // Shared with the Chrome Bridge content script.
            const request = {
                teklaGuid,
                ifcGuid,
                projectKey: PROJECT_KEY
            };

let redirected = false;
let reuseConfirmed = false;

function redirect() {
    if (redirected || reuseConfirmed) return;

    redirected = true;
    location.replace(PROJECT_URL);
}

            // Prefer confirmed Chrome Bridge capture.
            window.addEventListener("message", event => {
                if (event.source !== window ||
                    event.origin !== location.origin ||
                    event.data?.type !== "BPA_SHORT_CAPTURED" ||
                    event.data.teklaGuid !== teklaGuid) {
                    return;
                }

if (event.data.reusedTab === true) {
    reuseConfirmed = true;

    status.textContent =
        "Existing Trimble Connect tab found.";

    return;
}

status.textContent =
    "Opening Trimble Connect...";

redirect();
            });

            // Let the Chrome Bridge read the validated request.
            window.postMessage({
                type: "BPA_SHORT_LAUNCH",
                request
            }, location.origin);

            // Allow normal project opening if the extension
            // is unavailable, while keeping the page visible
            // long enough for the Bridge to capture the GUID.
            setTimeout(() => {
    if (!reuseConfirmed) {
        redirect();
    }
}, 3000);

        } catch (error) {
            status.textContent =
                "Invalid BPA drawing link: " + error.message;
        }
    })();
		</script>
	</body>
</html>
